<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分頁範例</title>
    <style>
        /* CSS 部分 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
        }

        header {
            background-color: #0078d4;
            color: #fff;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        main {
            padding: 20px;
            text-align: center;
        }

        main p {
            font-size: 18px;
            line-height: 1.6;
        }

        .audio-controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            color: #fff;
            background-color: #0078d4;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <header>
        <h1>歡迎來到我的網站</h1>
        <!-- 自定義圖片 -->
        <img src="your-photo.jpg" alt="Your Photo">
    </header>

    <main>
        <h2>這是分頁內容</h2>
        <p>
            這是一個示範的 HTML 頁面，包含自定義圖片的標頭、文字內容，以及聲音的播放功能。當 NFC 被觸發時，會自動播放背景音樂。
        </p>

        <!-- 聲音播放區 -->
        <div class="audio-controls">
            <audio id="backgroundAudio" preload="auto">
                <source src="your-audio-file.mp3" type="audio/mpeg">
            </audio>
            <button onclick="playAudio()">播放音樂</button>
            <button onclick="pauseAudio()">暫停音樂</button>
        </div>
    </main>

    <script>
        // JavaScript 部分
        const backgroundAudio = document.getElementById('backgroundAudio');

        // 播放和暫停功能
        function playAudio() {
            backgroundAudio.play();
        }

        function pauseAudio() {
            backgroundAudio.pause();
        }

        // NFC 模擬觸發自動播放
        if ('NDEFReader' in window) {
            const reader = new NDEFReader();
            reader.scan().then(() => {
                console.log('NFC scanning started.');
                backgroundAudio.play(); // NFC 觸發播放音樂
            }).catch(error => {
                console.error('NFC error:', error);
            });
        } else {
            console.log('NFC 不被支援，無法啟用掃描功能。');
        }
    </script>
</body>
</html>
